- aid: wise:wise-user-api
  name: Wise user API
  description: >-
    A User serves as the primary entity and can possess multiple Profiles to represent different contexts
    or settings.

    A User can have one personal Profile and multiple business Profiles.

    Each [Profile](/api-reference/profile) — whether personal or business — can have its own [multi-currency
    account](/api-reference/multi-currency-account),

    enabling transactions across various currencies. This hierarchical structure allows for flexible management
    of user settings and financial operations,

    accommodating both personal and business needs.


