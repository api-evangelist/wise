- aid: wise:wise-case-api
  name: Wise case API
  description: >-
    Partner Cases are part of the Partner Support API, allowing partners to open, retrieve and respond
    to support and operations queries.


    The endpoints described here allow partners to directly integrate their back end tooling with Wise's,
    allowing faster responses, better structure to data, and operational efficiencies.


    {% admonition type="warning" %}

    The Partner Support APIs are currently in a closed Beta and subject to change. Please speak with your
    implementation manager if you would like to integrate with these APIs.

    {% /admonition %}


    Case Statuses {% #case-statuses .title-3 .m-t-5 %}


    Partner cases can move through different statuses.


    | Status | Transitions to | Description |

    |--------|---------------|-------------|

    | `CREATING` | OPEN | Cases being created by Wise from a Partner call. Once created, cases move into
    the open status. |

    | `OPEN` | PENDING, SOLVED, CLOSED | Cases being actioned by Wise. Partners do not need to action
    these cases. Note that we may update a case in this status and not change it. |

    | `PENDING` | OPEN, SOLVED, CLOSED | Cases that require additional information from the partner. You
    should action these cases by reviewing the newest comment and updating the case. |

    | `SOLVED` | OPEN, PENDING, CLOSED | Cases that have been solved and scheduled for closure. These
    can be re-opened by the partner or Wise if needed before closing. |

    | `CLOSED` | — | Cases that have been solved and closed. Once closed, they cannot be reopened and
    a new case should be created if needed. |


    {% img src="/images/diagrams/case-flow.png" /%}
