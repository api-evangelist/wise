- aid: wise:wise-transfer-api
  name: Wise transfer API
  description: >-
    A transfer is a payment order to a [recipient account](/api-reference/recipient) based on a [quote](/api-reference/quote).


    Once created, a transfer usually needs to be funded within fourteen days. Otherwise, it will be automatically
    cancelled.


    There are 2 types of transfer resources: standard transfer resource and originator transfer resource.
    Please see below for differences between the two.


    Standard Transfer {% #standard-transfer .title-3 .m-t-5 %}


    The standard transfer object is returned by the [create transfer](/api-reference/transfer/transfercreate),
    [get transfer](/api-reference/transfer/transferget), [list transfers](/api-reference/transfer/transferlist),
    and [cancel transfer](/api-reference/transfer/transfercancel) endpoints.


    Originator Transfer {% #originator-transfer .title-3 .m-t-5 %}


    The originator transfer object is returned by the [create third party transfer](/api-reference/transfer/transferthirdpartycreate)
    and [get third party transfer](/api-reference/transfer/transferthirdpartyget) endpoints. It includes
    an additional `originator` data block with details about the payment originator.
  humanURL: https://docs.wise.com/api-docs/api-reference/profile
  baseURL: https://api.wise.com/v2
