    get:
      operationId: transferPayoutInfoGet
      summary: Get payout information
      description: 'Fetch banking reference information for transfers that are in `outgoing_payment_sent` status, enabling you to track transfers with the transfer recipient''s bank.


        It may take up to 3 days to get the correct information through this endpoint, as some partners don''t share the information until 3 days later.

        '
      tags:
