        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/X-External-Correlation-Id'
      responses:
        '200':
          description: Returns payout information for the transfer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  processorName:
                    type: string
                    description: The legal entity that processed the transfer on behalf of the customer
                    example: Acme Bank Ltd.
                  deliveryMode:
                    type: string
                    description: The delivery mode for the payment (e.g. SWIFT)
                    example: SWIFT
                  bankingPartnerReference:
                    type: string
                    description: The reference used by the partner bank to identify and track the transfer
                    example: ABCD1234
                  bankingPartnerName:
                    type: string
                    description: The name of the sending bank to the recipient's bank
                    example: Global Bank Corp.
                  mt103:
                    type:
                    - string
                    - 'null'
                    description: The MT103 of the transfer, if available
              example:
                processorName: Acme Bank Ltd.
                deliveryMode: SWIFT
                bankingPartnerReference: ABCD1234
                bankingPartnerName: Global Bank Corp.
                mt103: '{1:F01XXXXGBXXAXXX0000000000}{2:I103XXXXGBXXXXXXN}{3:{108:1234567}{111:001}{121:00000000-0000-0000-0000-000000000000}}{4:

                  :20:1234567

                  :23B:CRED

                  :32A:221212USD12345,

                  :33B:USD12345,

                  :50K:/11111111

                  SOME COMPANY INC.

                  1 SOME STREET MIAMI 33132 US

                  :59:/GB00000000000000

                  COMPANY NAME LTD

                  UK LONDON 1234 GB

                  :70:REFERENCE

                  :71A:OUR

                  :71G:USD11,

                  -}

                  '
          headers:
            X-External-Correlation-Id:
