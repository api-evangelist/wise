  /v3/profiles/{profileId}/transfers/{transferId}/payments:
    post:
      operationId: transferFund
      summary: Fund a transfer
      description: '{% admonition type="warning" %}

        This endpoint is SCA protected when it applies. If your profile is registered within the UK and/or EEA, SCA most likely applies to you.

        Please read more about [implementing SCA](/guides/developer/auth-and-security/sca-and-2fa).

        {% /admonition %}


        This API call is the final step for executing payouts when using a balance with Wise. Upon calling the endpoint, Wise will begin the processing of the transfer, depending on the status of funds.


        When using the transfer by transfer settlement model, the following funding type(s) must be used:


        - **BALANCE** — Funds are pulled from a multi-currency account held with Wise.

        - **BANK_TRANSFER** — Manually send funds from your business bank account to pay for any transfers. Only applicable when using the [Batch Group API](/api-reference/batch-group/).


        When funding through the Bulk Settlement model, the following funding type(s) must be used:


        - **TRUSTED_PRE_FUND_BULK** — Funds for the transfer will be settled through a bulk payment at a later date. This method is not applicable for First Party partner account transfers.


        If funding from `BALANCE`, and your multi-currency account does not have the required funds to complete the action, then this call will fail with an "insufficient funds" error. Once funds are added and available, you must call this endpoint again.

        '
      tags:
      - transfer
      security:
      - UserToken: []
      - PersonalToken: []
      parameters:
      - name: profileId
        in: path
        required: true
        description: The profile ID that created the transfer. Can be either your personal or business profile ID
        schema:
          type: integer
          format: int64
      - name: transferId
        in: path
        required: true
        description: The transfer ID
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/X-External-Correlation-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  description: The type of funding to apply to the transfer
                  example: BALANCE
                partnerReference:
                  type: string
                  description: The transaction/payment identifier in your system, uniquely identifies the transfer in your platform. Required for the Cross Currency Bulk Settlement model
      responses:
        '200':
          description: Transfer funding result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    description: The type of funding applied to the transfer
                    example: BALANCE
                  status:
                    type: string
                    enum:
                    - COMPLETED
                    - REJECTED
                    description: Funding status
                    example: COMPLETED
                  errorCode:
                    type:
                    - string
                    - 'null'
                    description: Failure reason
                    example: null
              examples:
                completed:
                  summary: Balance - Completed
                  value:
                    type: BALANCE
                    status: COMPLETED
                    errorCode: null
                insufficient-funds:
                  summary: Balance - Insufficient Funds
                  value:
                    type: BALANCE
                    status: REJECTED
                    errorCode: transfer.insufficient_funds
          headers:
            X-External-Correlation-Id:
              $ref: '#/components/headers/X-External-Correlation-Id'
            x-trace-id:
              $ref: '#/components/headers/x-trace-id'
        '404':
          description: Transfer not found.
          headers:
            X-External-Correlation-Id:
              $ref: '#/components/headers/X-External-Correlation-Id'
            x-trace-id:
              $ref: '#/components/headers/x-trace-id'
        '429':
          $ref: '#/components/responses/429'
