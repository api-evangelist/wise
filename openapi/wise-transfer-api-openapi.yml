  /v1/profiles/{profileId}/partner-licence-transfers:
    post:
      operationId: transferPartnerLicenceCreate
      summary: Create a partner licence transfer
      deprecated: true
      description: '{% admonition type="warning" name="Deprecated" %}

        This endpoint is deprecated and only maintained for existing legacy integrations. Do not use it for new integrations. Use [Create a transfer](/api-reference/transfer/transfercreate) or [Create a third party transfer](/api-reference/transfer/transferthirdpartycreate) instead.

        {% /admonition %}


        This is similar to the [Create a transfer](/api-reference/transfer/transfercreate) endpoint, but the `originator` datablock is additionally required.


        You need to save the transfer ID for tracking its status later via webhooks.


        #### Avoiding duplicate transfers


        The `customerTransactionId` field is used to avoid duplicate transfer requests. If your initial call fails (error or timeout), retry the call using the same `customerTransactionId` value. Subsequent retry messages are treated as repeat messages and will not create duplicate transfers.

        '
      tags:
      - transfer
      security:
      - UserToken: []
      parameters:
      - name: profileId
        in: path
        required: true
        description: The profile ID
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/X-External-Correlation-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetAccount
              - quote
              - customerTransactionId
              - originator
              properties:
                sourceAccount:
                  type: integer
                  format: int64
                  description: Refund recipient account ID
                targetAccount:
                  type: integer
                  format: int64
                  description: Recipient account ID. You can create multiple transfers to same recipient account
                quote:
                  type: string
                  description: V2 quote ID. You can only create one transfer per one quote. You cannot use same quote ID to create multiple transfers
                customerTransactionId:
                  type: string
                  description: Unique transfer ID in your system. Also used to perform idempotency check to avoid duplicate transfers. You can only submit one transfer with same customerTransactionId
                details:
                  type: object
                  properties:
                    reference:
                      type: string
                      description: Recipient will see this reference text in their bank statement. Maximum allowed characters depends on the currency route. See [Business Payments Tips](https://wise.com/help/articles/2932870/tips-for-paying-invoices) for a full list
                originator:
                  type: object
                  required:
                  - legalEntityType
                  - externalId
                  - address
                  description: Data block to capture payment originator details
                  properties:
                    legalEntityType:
                      type: string
                      enum:
                      - PRIVATE
                      - BUSINESS
                      description: Payment originator legal type
                    externalId:
                      type: string
                      description: Unique customer ID in your system. This allows Wise to uniquely identify each originator
                    name:
                      type: object
                      description: 'Originator name details. Required fields depend on the legal entity type: `givenName` and `familyName` are required for `PRIVATE`, `fullName` is required for `BUSINESS`'
                      properties:
                        givenName:
                          type: string
                          description: Payment originator first name. Required if `legalEntityType = PRIVATE`
                        middleNames:
                          type: array
                          items:
                            type: string
                          description: Payment originator middle name(s). Used only if `legalEntityType = PRIVATE`
                        familyName:
                          type: string
                          description: Payment originator family name. Required if `legalEntityType = PRIVATE`
                        patronymicName:
                          type: string
                          description: Payment originator patronymic name. Used only if `legalEntityType = PRIVATE`
                        fullName:
                          type: string
                          description: Payment originator full legal name. Required if `legalEntityType = BUSINESS`
                    dateOfBirth:
                      type: string
                      format: date
                      description: Payment originator date of birth. Required if `legalEntityType = PRIVATE`
                    businessRegistrationCode:
                      type: string
                      description: Payment originator business registry number / incorporation number. Required if `legalEntityType = BUSINESS`
                    address:
                      type: object
                      required:
                      - firstLine
                      - city
                      - countryCode
                      properties:
                        firstLine:
                          type: string
                          description: Payment originator address first line
                        city:
                          type: string
                          description: Payment originator address city
                        stateCode:
                          type: string
                          description: Payment originator address state code. Required if address country code in (US, CA, BR, AU)
                        countryCode:
                          type: string
                          description: Payment originator address country code ISO 3166-1 alpha-2
                          minLength: 2
                          maxLength: 2
                        postCode:
                          type: string
                          description: Originator address zip code
                    accountDetails:
                      type: string
                      description: Originator account number
            examples:
              personal:
                summary: Personal originator
                value:
                  sourceAccount: 12345678
                  targetAccount: 87654321
                  quote: 8fa9be20-ba43-4b15-abbb-9424e1481050
                  customerTransactionId: unique-transfer-id-in-your-system
                  details:
                    reference: Ski trip
                  originator:
                    legalEntityType: PRIVATE
                    externalId: CST-2991992
                    name:
                      givenName: John
                      middleNames:
                      - Ryan
                      familyName: Godspeed
                    dateOfBirth: '1977-07-01'
                    address:
                      firstLine: Salu tee 100, Apt 4B
                      city: Tallinn
                      countryCode: EE
                      postCode: '12112'
                    accountDetails: the unique account number of the customer
              business:
                summary: Business originator
                value:
                  sourceAccount: 12345678
                  targetAccount: 87654321
                  quote: 8fa9be20-ba43-4b15-abbb-9424e1481050
                  customerTransactionId: unique-transfer-id-in-your-system
                  details:
                    reference: Payment for invoice 22092
                  originator:
                    legalEntityType: BUSINESS
                    externalId: BIZ-2991992
                    name:
                      fullName: Hot Air Balloon Services Ltd
                    businessRegistrationCode: '1999212'
                    address:
                      firstLine: Aiandi tee 1431
                      city: Tallinn
                      countryCode: EE
                      postCode: '12112'
                    accountDetails: the unique account number of the customer
      responses:
        '200':
          description: Partner licence transfer successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/originator-transfer'
          headers:
            X-External-Correlation-Id:
              $ref: '#/components/headers/X-External-Correlation-Id'
            x-trace-id:
              $ref: '#/components/headers/x-trace-id'
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    transfer:
      title: Standard Transfer
      x-tags:
      - transfer
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Transfer ID
          example: 16521632
        user:
          type: integer
          format: int64
          description: Your user ID
          example: 4342275
        targetAccount:
          type: integer
          format: int64
          description: Recipient account ID
          example: 8692237
        sourceAccount:
          type:
          - integer
          - 'null'
          format: int64
          description: Refund recipient account ID
          example: null
        quote:
          type:
          - integer
          - 'null'
          format: int64
          description: V1 quote ID
          example: null
        quoteUuid:
          type: string
          format: uuid
          description: V2 quote ID
          example: 8fa9be20-ba43-4b15-abbb-9424e1481050
        status:
          type: string
          description: Transfer current status. See [Tracking Transfers](/guides/product/send-money/tracking-transfers) for all possible statuses.
          example: incoming_payment_waiting
        reference:
          type: string
          description: Deprecated, use `details.reference` instead
          deprecated: true
          example: reference text
        rate:
          type: number
          description: Exchange rate value
          example: 0.89
        created:
          type: string
          format: date-time
          description: Timestamp when transfer was created
          example: '2017-11-24 10:47:49'
        business:
          type:
          - integer
          - 'null'
          format: int64
          description: Your business profile ID
          example: null
        transferRequest:
          type:
          - integer
          - 'null'
          description: Deprecated
          deprecated: true
          example: null
        details:
          type: object
          properties:
            reference:
              type: string
              description: Payment reference text
              example: Testing
        hasActiveIssues:
          type: boolean
          description: Are there any pending issues which stop executing the transfer?
          example: false
        sourceCurrency:
          type: string
          description: Source currency code
          example: EUR
        sourceValue:
          type: number
          description: Transfer amount in source currency
          example: 0
        targetCurrency:
          type: string
          description: Target currency code
          example: GBP
        targetValue:
          type: number
          description: Transfer amount in target currency
          example: 150
        customerTransactionId:
          type: string
          format: uuid
          description: Unique identifier randomly generated per transfer request by the calling client
          example: 54a6bc09-cef9-49a8-9041-f1f0c654cd88
        payinSessionId:
          type: string
          format: uuid
          description: ID of the Payin Session generated for the transfer, which can be used for certain payin methods when funding the transfer
          example: 23330542-8e9e-419f-95eb-312b880f92ad
    payment:
      title: Payment
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Payment ID
          example: 50000000
        method:
          type: string
          description: The payment method used to pay for the transfer
          example: BANK_TRANSFER
        pricingVariant:
          type:
          - string
          - 'null'
          description: The qualifier that allows to apply different pricing policy within the same payment method. Often the value might be the payment method itself
          example: null
        amount:
          type: number
          description: Transfer source amount
          example: 1000
        currency:
          type: string
          description: Transfer source currency
          example: GBP
        timeCreated:
          type: string
          format: date-time
          description: Date of when payment was created
          example: '2020-01-01T12:30:15.000Z'
        timeUpdated:
          type: string
          format: date-time
          description: Date of when payment was updated
          example: '2020-01-01T12:30:15.000Z'
    originator-transfer:
      title: Originator Transfer
      x-tags:
      - transfer
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Transfer ID
          example: 16521632
        user:
          type: integer
          format: int64
          description: Your user ID
          example: 4342275
        targetAccount:
          type: integer
          format: int64
          description: Recipient account ID
          example: 8692237
        sourceAccount:
          type:
          - integer
          - 'null'
          format: int64
          description: Refund recipient account ID
          example: null
        quote:
          type: string
          description: Quote ID
          example: 8fa9be20-ba43-4b15-abbb-9424e1481050
        status:
          type: string
