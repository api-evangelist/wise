            value:
              type: string
              description: Icon value (e.g., emoji character).
          example: null
        investmentState:
          type: string
          description: 'Investment state of the balance.

            - `NOT_INVESTED` - Balance is not invested.

            - `INVESTED` - Balance is invested in assets.

