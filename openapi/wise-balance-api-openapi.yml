webhooks:
  hold-limit-breach#update:
    post:
      operationId: eventHoldLimitBreachUpdate
      summary: Hold limit breach update
      description: 'Triggered whenever a hold limit breach is opened or closed for a profile. A hold limit breach occurs when a balance exceeds the regulatory hold limit (applicable in countries such as Singapore and Malaysia).

        See the [Webhooks guide](/guides/developer/webhooks) for setup instructions, signature verification, and best practices.


        Events may not be delivered in the order they occurred. Use `data.occurred_at` to reconcile the order.

        See the [Event Ordering](/guides/developer/webhooks/event-ordering) guide for details.


        Use `data.state` to determine whether the breach has been opened or closed, and `data.closing_reason` to understand how it was resolved.


        * Event type: `hold-limit-breach#update`

        * Profile level subscriptions: Supported

        * Application level subscriptions: Supported

        '
      tags:
      - balance
      parameters:
      - $ref: '#/components/parameters/x-signature-sha256'
      - $ref: '#/components/parameters/x-delivery-id'
      - $ref: '#/components/parameters/x-test-notification'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v4.0.0-4'
            examples:
              breachOpened:
                summary: Breach opened
                value:
                  schema_version: 4.0.0
                  subscription_id: 01234567-89ab-cdef-0123-456789abcdef
                  event_type: hold-limit-breach#update
                  sent_at: '2024-06-01T08:00:00Z'
                  data:
                    resource:
                      type: hold-limit-breach
                      hold_limit_breach_id: 1001
                      profile_id: 12321323
                    amount: 500.5
                    currency: SGD
                    state: OPEN
                    closing_reason: null
                    created_at: '2024-06-01T08:00:00Z'
                    updated_at: '2024-06-01T08:00:00Z'
                    occurred_at: '2024-06-01T08:00:00Z'
              breachClosed:
                summary: Breach closed
                value:
                  schema_version: 4.0.0
                  subscription_id: 01234567-89ab-cdef-0123-456789abcdef
                  event_type: hold-limit-breach#update
                  sent_at: '2024-06-02T09:15:00Z'
                  data:
                    resource:
                      type: hold-limit-breach
                      hold_limit_breach_id: 1001
                      profile_id: 12321323
                    amount: 500.5
                    currency: SGD
                    state: CLOSED
                    closing_reason: MANUALLY_RESOLVED
                    created_at: '2024-06-01T08:00:00Z'
                    updated_at: '2024-06-02T09:15:00Z'
                    occurred_at: '2024-06-02T09:15:00Z'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
          description: Return any `2xx` status to acknowledge receipt of the event.
components:
  schemas:
    HoldLimitBreach:
      type: object
      x-tags:
      - balance
      description: Represents a hold limit breach.
      properties:
        id:
          type: integer
          format: int64
          description: Hold limit breach ID.
          example: 200001
        profileId:
          type: integer
          format: int64
          description: ID of the profile that owns the hold limit breach
          example: 123456
        amount:
          type: number
          description: Amount value.
          example: 310.86
        currency:
          type: string
          description: Currency code (ISO 4217 Alphabetic Code).
          example: EUR
        state:
          type: string
          description: Current state of the hold limit breach.
          enum:
          - OPEN
          - CLOSED
          x-enumDescriptions:
            OPEN: Hold limit breach is open and needs to be resolved.
            CLOSED: Hold limit breach is closed and resolved.
          example: OPEN
        closingReason:
          type: string
          description: Reason the breach was closed, null if state is `OPEN`.
          enum:
          - AUTOMATICALLY_RESOLVED
          - MANUALLY_RESOLVED
          x-enumDescriptions:
            AUTOMATICALLY_RESOLVED: The breach was resolved automatically after the customer withdrew funds and the balance dropped below the hold limit.
            MANUALLY_RESOLVED: The breach was closed by calling the [Close Hold Limit Breach](/api-reference/balance/holdlimitbreachclose) endpoint with a specified recipient.
          example: AUTOMATICALLY_RESOLVED
        createdAt:
          type: string
          format: date-time
          description: Date when the hold limit breach was created.
          example: '2020-05-20T14:43:16.658Z'
        updatedAt:
          type: string
          format: date-time
          description: Date when the hold limit breach was last modified.
          example: '2020-05-20T14:43:16.658Z'
