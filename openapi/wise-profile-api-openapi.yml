                        type: string
                        example: gbr
                      postCode:
                        type: string
                        example: '11111'
                      stateCode:
                        type: string
                webpage:
                  type: string
                  description: 'Business webpage. Required if `companyType` is `OTHER`. If this is not provided for an `OTHER` companyType, the profile should not be allowed to create a transfer.

