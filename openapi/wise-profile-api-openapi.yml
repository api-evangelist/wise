              $ref: '#/components/headers/x-trace-id'
        '429':
          $ref: '#/components/responses/429'
    put:
      operationId: profileBusinessRepresentativeUpdate
      summary: Update business representative
      description: 'Update or transfer the Business Representative for the specified Business Profile.


        Set `updateContext` to `UPDATE_DETAILS` to update the existing Business Representative''s details, or `TRANSFER_OF_AUTHORISATION` to transfer authority of the Business Profile to a new Business Representative.


        {% admonition type="info" %}

        If the Business Representative has been verified then there are restrictions on what information is allowed to change.

        {% /admonition %}


        {% admonition type="info" %}

        If this Business Representative is shared across multiple Business Profiles, then changes will be reflected for all of the Business Profiles.

        {% /admonition %}


        When using `TRANSFER_OF_AUTHORISATION`, this will overwrite the existing Business Representative. The new Business Representative will need to be verified for KYC purposes.

        '
      tags:
      - profile
      security:
      - UserToken: []
      parameters:
      - name: profileId
        in: path
        required: true
        description: Business profile ID.
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/X-External-Correlation-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                updateContext:
                  type: string
                  description: Context of the update.
                  enum:
                  - UPDATE_DETAILS
                  - TRANSFER_OF_AUTHORISATION
                  example: UPDATE_DETAILS
                firstName:
                  type: string
                  description: First name of the person representing the business (including middle names).
                  example: Oliver
                lastName:
                  type: string
                  description: Last name of the person representing the business.
                  example: Wilson
                preferredName:
                  type: string
                  description: Preferred first name, if different to the legal first name.
                  example: Olivia
                address:
                  type: object
                  properties:
                    addressFirstLine:
                      type: string
                      description: First line of address.
                      example: 50 Sunflower Ave
                    city:
                      type: string
                      description: City.
                      example: Phoenix
                    countryIso3Code:
                      type: string
                      description: 3 letter country code (lower case).
                      example: usa
                    postCode:
                      type: string
                      description: Postal code.
                      example: '10025'
                    stateCode:
                      type: string
                      description: State code (max 5 chars). Required for US, CA, BR and AU addresses.
                      example: AZ
                contactDetails:
                  type: object
                  properties:
                    email:
                      type: string
                      description: Contact email address of the person representing the business. Please speak with your integration account manager for details on how customer communication is handled for your integration.
                      example: o.wilson@example.com
                    phoneNumber:
                      type: string
                      description: Contact phone number in international phone number format, example "+1408XXXXXXX" of the person representing the business. Please speak with your integration account manager for details on how customer communication is handled for your integration.
                      example: '+3725064992'
                dateOfBirth:
                  type: string
                  description: Date of birth.
                  example: '1977-07-01'
                actorEmail:
                  type: string
                  description: Email of the actor.
                  example: biz-acct@abcl.com
            examples:
              updateDetails:
                summary: Update Details
                value:
                  updateContext: UPDATE_DETAILS
                  contactDetails:
                    email: o.wilson@example.com
                    phoneNumber: '+3725064992'
              transferOfAuthorisation:
                summary: Transfer of Authorisation
                value:
                  updateContext: TRANSFER_OF_AUTHORISATION
                  firstName: Oliver
                  lastName: Wilson
                  preferredName: Olivia
                  address:
                    addressFirstLine: 50 Sunflower Ave
                    city: Phoenix
                    countryIso3Code: usa
                    postCode: '10025'
                    stateCode: AZ
                  dateOfBirth: '1977-07-01'
                  contactDetails:
                    email: o.wilson@example.com
                    phoneNumber: '+3725064992'
      responses:
        '200':
          description: Business representative updated successfully.
          headers:
            X-External-Correlation-Id:
              $ref: '#/components/headers/X-External-Correlation-Id'
            x-trace-id:
              $ref: '#/components/headers/x-trace-id'
        '429':
          $ref: '#/components/responses/429'
  /v1/profiles/{profileId}/verification-documents:
    post:
      operationId: profileVerificationDocumentCreate
      summary: Create an identification document
      description: 'Add an identification document to a personal profile. Not applicable to business profiles.


        For SSN submissions, only `type` and `uniqueIdentifier` (9 digits, no letters or symbols) are required.

        '
      tags:
      - profile
      security:
      - UserToken: []
      parameters:
      - name: profileId
        in: path
        required: true
        description: Profile ID.
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/X-External-Correlation-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: Person first name in document.
                  example: Oliver
                lastName:
                  type: string
                  description: Person last name in document.
                  example: Wilson
                type:
                  type: string
                  description: Document type.
                  enum:
                  - DRIVERS_LICENCE
                  - IDENTITY_CARD
                  - GREEN_CARD
                  - MY_NUMBER
                  - PASSPORT
                  - SSN
                  - EMIRATES_EMPLOYER
                  - EMIRATES_PLACE_OF_BIRTH
                  - CPF_CNPJ
                  - FINANCIAL_CAPACITY_BR
                  - OTHER
                  example: IDENTITY_CARD
                uniqueIdentifier:
                  type: string
                  maxLength: 30
                  description: Document number or value. Must be digits only when SSN or FINANCIAL_CAPACITY_BR.
                  example: AA299822313
                issueDate:
                  type: string
                  description: Document issue date.
                  example: '2017-12-31'
                issuerCountry:
                  type: string
                  description: Issued by country code. For example "US".
                  example: EE
                issuerState:
                  type: string
                  description: Issued by state code. For example "NY".
                  example: ''
                expiryDate:
                  type: string
                  description: Document expiry date.
                  example: '2027-12-31'
                nationality:
                  type: string
                  description: 2 characters ISO country code.
                employerName:
                  type: string
                  description: The name of the employer. Type must be EMIRATES_EMPLOYER.
                employerCity:
                  type: string
                  description: The city of the employer. Type must be EMIRATES_EMPLOYER.
                employerCountry:
                  type: string
                  description: 2 characters ISO country code. Type must be EMIRATES_EMPLOYER.
                birthCity:
                  type: string
                  description: The city of birth of the customer.
                birthCountry:
                  type: string
                  description: 2 characters ISO country code.
            examples:
              identityCard:
                summary: Identity Card
                value:
                  firstName: Oliver
                  lastName: Wilson
                  type: IDENTITY_CARD
                  uniqueIdentifier: AA299822313
                  issueDate: '2017-12-31'
                  issuerCountry: EE
                  issuerState: ''
                  expiryDate: '2027-12-31'
              cpfCnpj:
                summary: CPF or CNPJ
                value:
                  type: CPF_CNPJ
                  uniqueIdentifier: 938.936.652-69
              financialCapacityBr:
                summary: Financial Capacity Brazil
                value:
                  type: FINANCIAL_CAPACITY_BR
                  uniqueIdentifier: '150000.00'
      responses:
        '200':
          description: Identification document created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type:
                    - string
                    - 'null'
                    example: null
                  success:
                    type: boolean
                    example: true
          headers:
            X-External-Correlation-Id:
              $ref: '#/components/headers/X-External-Correlation-Id'
            x-trace-id:
              $ref: '#/components/headers/x-trace-id'
        '429':
          $ref: '#/components/responses/429'
    put:
      operationId: profileVerificationDocumentUpdate
      summary: Update an identification document
      description: "Update an existing identification document on a personal profile. Not\napplicable to business profiles.\n\nThis endpoint performs a full replacement of the document details. Any\nfields not provided in the request body will be set to null on the stored\ndocument. Partners must provide all fields they wish to retain. \n\nOnly partners with a KYC partner onboarding model\nare permitted to use this endpoint. Non-KYC partners will receive a 400 error.\n"
      tags:
      - profile
      security:
      - UserToken: []
      parameters:
      - name: profileId
        in: path
        required: true
        description: Profile ID.
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/X-External-Correlation-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - clientId
              properties:
                clientId:
                  type: string
                  description: The partner's client ID.
                  example: mercury
                firstName:
                  type: string
                  description: Person first name in document.
                  example: Oliver
                lastName:
                  type: string
                  description: Person last name in document.
                  example: Wilson
                type:
                  type: string
                  description: Document type.
                  enum:
                  - DRIVERS_LICENCE
                  - IDENTITY_CARD
                  - GREEN_CARD
                  - MY_NUMBER
                  - PASSPORT
                  - SSN
                  - EMIRATES_EMPLOYER
                  - EMIRATES_PLACE_OF_BIRTH
                  - CPF_CNPJ
                  - FINANCIAL_CAPACITY_BR
                  - OTHER
                  example: IDENTITY_CARD
                uniqueIdentifier:
                  type: string
                  maxLength: 30
                  description: Document number or value. Must be digits only when SSN or FINANCIAL_CAPACITY_BR.
                  example: AA299822313
                issueDate:
                  type: string
                  description: Document issue date.
                  example: '2017-12-31'
                issuerCountry:
                  type: string
                  description: Issued by country code. For example "US".
                  example: EE
                issuerState:
                  type: string
                  description: Issued by state code. For example "NY".
                  example: ''
                expiryDate:
                  type: string
                  description: Document expiry date.
                  example: '2027-12-31'
                nationality:
                  type: string
                  description: 2 characters ISO country code.
                sex:
                  type: string
                  description: Sex as stated in the document.
                  enum:
                  - MALE
                  - FEMALE
                  example: MALE
                placeOfBirth:
                  type: string
                  description: Place of birth as stated in the document.
                  example: London
            examples:
              identityCard:
                summary: Update Identity Card
                value:
                  clientId: mercury
                  firstName: Oliver
                  lastName: Wilson
                  type: IDENTITY_CARD
                  uniqueIdentifier: AA299822313
                  issueDate: '2017-12-31'
                  issuerCountry: EE
                  issuerState: ''
                  expiryDate: '2027-12-31'
                  nationality: GB
                  sex: MALE
              driversLicence:
                summary: Update Drivers Licence
                value:
                  clientId: mercury
                  firstName: Oliver
                  lastName: Wilson
                  type: DRIVERS_LICENCE
                  uniqueIdentifier: DL12345
                  issueDate: '2020-01-15'
                  issuerCountry: US
                  issuerState: NY
                  expiryDate: '2028-01-15'
      responses:
        '200':
          description: Identification document updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type:
                    - string
                    - 'null'
                    example: null
                  success:
                    type: boolean
                    example: true
          headers:
            X-External-Correlation-Id:
              $ref: '#/components/headers/X-External-Correlation-Id'
            x-trace-id:
              $ref: '#/components/headers/x-trace-id'
        '400':
          description: "Validation error. Possible error codes:\n- `not.allowed.for.clientId` — Partner is not found or is not a KYC\n  partner.\n- `not.allowed.for.uniqueIdentifier` — Document number exceeds maximum\n  length (30 characters).\n- `NotNull` — A required field (`type` or `clientId`) is missing.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: not.allowed.for.clientId
                        message:
                          type: string
                        field:
                          type: string
          headers:
            X-External-Correlation-Id:
              $ref: '#/components/headers/X-External-Correlation-Id'
            x-trace-id:
              $ref: '#/components/headers/x-trace-id'
        '429':
          $ref: '#/components/responses/429'
