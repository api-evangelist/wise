  /v2/profiles/personal-profile:
    post:
      operationId: profilePersonalCreate
      summary: Create a personal profile
      description: 'Create a personal profile for the authenticated user. A personal profile represents an individual and is required before creating transfers or business profiles.


        {% admonition type="info" %}

        Use the `X-idempotence-uuid` header to safely retry requests. If omitted and a profile already exists, the API returns `409 Conflict`. You can then retrieve existing profiles via [List profiles](/api-reference/profile/profilelist).

        {% /admonition %}


        Field notes {% .title-4 .m-t-3 %}


        - **First and last names** are limited to 30 characters each. Truncate if necessary (e.g. when a customer has many middle names).

        - **`occupations`** is required for CA, IN, JP, ID, IL, MX, and within the US for the state NM.

        - **`contactDetails`** are used for mandatory customer notifications and to help identify your customer when contacting Wise support.

        '
      tags:
      - profile
      security:
      - UserToken: []
      - PersonalToken: []
      parameters:
      - name: X-idempotence-uuid
        in: header
        required: false
        description: Unique idempotency key for the request.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/X-External-Correlation-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - dateOfBirth
              - address
              - contactDetails
              properties:
                firstName:
                  type: string
                  maxLength: 30
                  description: First name (including middle names).
                  example: Oliver
                lastName:
                  type: string
                  maxLength: 30
                  description: Last name.
                  example: Wilson
                preferredName:
                  type: string
                  maxLength: 30
                  description: Preferred first name, if different to the legal first name.
                  example: Olivia
                firstNameInKana:
                  type:
                  - string
                  - 'null'
                  description: First name in Katakana. Required for from-JPY personal transfers.
                  example: null
                lastNameInKana:
                  type:
                  - string
                  - 'null'
                  description: Last name in Katakana. Required for from-JPY personal transfers.
                  example: null
                address:
                  type: object
                  required:
                  - addressFirstLine
                  - city
                  - countryIso3Code
                  properties:
                    addressFirstLine:
                      type: string
                      description: First line of address.
                      example: 50 Sunflower Ave
                    city:
                      type: string
                      description: City.
                      example: Phoenix
                    countryIso3Code:
                      type: string
                      description: 3 letter country code (lower case).
                      example: usa
                    postCode:
                      type: string
                      description: Postal code.
                      example: '10025'
                    stateCode:
                      type: string
                      maxLength: 5
                      description: State code. Required for US, CA, BR and AU addresses.
                      example: AZ
                nationality:
                  type: string
                  description: 3 letter country code (lower case).
                  example: usa
                dateOfBirth:
                  type: string
                  description: Date of birth.
                  example: '1977-07-01'
                externalCustomerId:
                  type: string
                  description: An external reference identifier mapping the customer of this profile to your system.
                  example: 12345-oliver-wilson
                contactDetails:
                  type: object
                  required:
                  - email
                  - phoneNumber
                  properties:
                    email:
                      type: string
                      description: Contact email address. Please speak with your integration account manager for details on how customer communication is handled for your integration.
                      example: o.wilson@example.com
                    phoneNumber:
                      type: string
                      description: Contact phone number in international phone number format, example "+1408XXXXXXX".
                      example: '+3725064992'
                occupations:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Occupation field code - this field accepts any job or occupation that the customer does, as the only occupation format currently accepted is `"FREE_FORM"`.
                        example: Software Engineer
                      format:
                        type: string
                        description: Occupation field format. As of now, it only accepts the value `"FREE_FORM"`.
                        example: FREE_FORM
      responses:
        '200':
          description: Created personal profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    description: Unique profile ID.
                    example: 30000001
                  type:
                    type: string
                    description: Profile type.
                    enum:
                    - PERSONAL
                    example: PERSONAL
                  details:
                    type: object
                    description: Profile details.
                    properties:
                      firstName:
                        type: string
                        description: First name (including middle names).
                        example: Oliver
                      lastName:
                        type: string
                        description: Last name.
                        example: Wilson
                      preferredName:
                        type: string
                        description: Preferred first name.
                        example: Olivia
                      firstNameInKana:
                        type:
                        - string
                        - 'null'
                        description: First name in Katakana.
                        example: null
                      lastNameInKana:
                        type:
                        - string
                        - 'null'
